name: Validar site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacao:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      DEPLOY_ENV: preview

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # O script build ja executa verificacao de tipos,
      # testes de programacao, de artefatos e de regressao.
      - name: Validar e compilar o site
        run: npm run build

      - name: Validar build de produção com documentos jurídicos bloqueados
        run: npm run build:production && npm run test:artifacts && node tests/migration.mjs && node tests/preproduction.mjs && node tests/institutional.mjs
